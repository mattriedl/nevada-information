# Downloads Wikipedia text and Commons photos (Wikimedia throttles most cloud IPs, but not GitHub's runners),
# rebuilds public/ and commits the result to main. Runs when the fetch or assemble scripts change, weekly, or by hand.
name: Refresh Wikipedia and Commons data

on:
  push:
    branches: [main]
    paths: ['build/fetch_sources.py', 'build/assemble.py', '.github/workflows/refresh-sources.yml']
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-sources
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch Wikipedia and Commons data
        env: { FETCH_MINUTES: '300' }
        run: python3 build/fetch_sources.py
      - name: Assemble data and build the site
        run: |
          python3 build/assemble.py
          python3 build/generate_site.py
          python3 build/check_site.py
      - name: Commit changes
        run: |
          git config user.name "nevada-information-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/sources build/data public
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh Wikipedia and Commons data and rebuild site"
          git pull --rebase origin main
          git push origin HEAD:main
